[project]
name = "carrier-ac"
version = "0.1.0"
description = "Local Carrier air conditioner discovery and control for Arch Linux"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "msmart-ng>=2025.9.0",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
carrier-ac = "carrier_ac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carrier_ac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
